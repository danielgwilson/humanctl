name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/secret-scan.sh
      - run: node scripts/leak-scan.mjs --selftest
      - run: node scripts/leak-scan.mjs --repo

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:lib
      # Proves the npm artifact is CLI-only and scans both the repository and
      # package contents for personal home paths and credential shapes.
      - run: npm run package:check
      - run: npm run publish:check
      - run: for f in dist/lib/*.js dist/bin/humanctl.js; do node --check "$f"; done
      - run: npm run pulse:selftest
      - run: npm run reader:selftest
      - run: npm run commands:selftest
      # Pure parser + orchestration for the Claude quota read (lib/claude-quota.ts).
      # Zero process spawns by construction: every case replays captured stdout
      # through an injected runner, so CI never invokes the `claude` CLI.
      - run: npm run quota:selftest
      # lib/span.ts's daily span-of-control counts (codex/claude split, notes
      # by level, missing-source-is-null contract) and the span.jsonl upsert.
      # Empties PATH for its own process so it never spawns a real `gh`.
      - run: npm run span:selftest
      - run: npm run build
